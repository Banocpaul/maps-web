name: Public incident report checks

on:
  push:
    branches: [main, codex/public-incident-reports, feature/public-resident-accounts]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  incident-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, mbstring, gd, fileinfo, sodium, bcmath
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Prepare test environment
        run: cp .env.example .env
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Generate test application key
        run: php artisan key:generate
      - name: Build frontend assets
        run: |
          npm ci
          npm run build
      - name: Compile Blade views
        run: php artisan view:cache
      - name: Test public reporting, fire SMS, flood observations, and audit fixes
        run: |
          php vendor/phpunit/phpunit/phpunit -c phpunit-public-reports.xml
          php vendor/phpunit/phpunit/phpunit --filter 'FloodAnalystGisTest|AuditTimeHandlingTest|DashboardRoleAnalyticsTest|UserManagementTest|OperationsManagerAuthorizationTest|ActivityLogExportTest|DatabaseBackupAuthorizationTest|PredictionHistoryTest|ProcessDashboardTest|OperationalRecordsTest'
